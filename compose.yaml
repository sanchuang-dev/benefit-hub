# Caddy is installed on the host; do not run a second proxy container.
services:
  benefit-hub:
    image: benefit-hub:${BENEFIT_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${BENEFIT_HTTP_PORT:-18080}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_FILE: /data/benefit.sqlite
      # Session cookies must be Secure behind the host Caddy TLS terminator.
      COOKIE_SECURE: "true"
      # Caddy sets X-Forwarded-For; the app port is only published on 127.0.0.1.
      TRUST_PROXY: "true"
      SESSION_TTL_HOURS: "8"
      # Optional D-mode catalogue reads only. Supply these from a host-owned,
      # private Compose environment (never Git, image or browser bundle).
      # Missing values intentionally leave the server reader unavailable (503).
      YANGMAO_INRICE_BASE_URL: ${YANGMAO_INRICE_BASE_URL:-}
      YANGMAO_INRICE_APP_KEY: ${YANGMAO_INRICE_APP_KEY:-}
      YANGMAO_INRICE_APP_SECRET: ${YANGMAO_INRICE_APP_SECRET:-}
      # A single independent master key protects provider connection records.
      BENEFIT_SUPPLIER_MASTER_KEY: ${BENEFIT_SUPPLIER_MASTER_KEY:-}
      # Real D dispatch can deduct the supplier monetary balance. Keep off unless
      # a maintainer explicitly authorizes one controlled live acceptance.
      BENEFIT_D_LIVE_WRITE_ENABLED: ${BENEFIT_D_LIVE_WRITE_ENABLED:-false}
    volumes:
      - "${BENEFIT_DATA_DIR:-/srv/benefit-hub/data}:/data"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
