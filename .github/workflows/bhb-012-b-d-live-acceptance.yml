name: BHB-012-B D Live Acceptance Platform Preflight

on:
  push:
    branches:
      - feat/bhb-012-b-d-live-acceptance-20261031
    paths:
      - .github/workflows/bhb-012-b-d-live-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install SSH transport
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null

      - name: Inspect live platform prerequisites without secret values
        shell: bash
        env:
          TARGET_HOST: ${{ secrets.PROTO_HOST }}
          TARGET_USER: ${{ secrets.PROTO_USER }}
          TARGET_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
        run: |
          set -euo pipefail
          case "$TARGET_HOST" in
            8.148.148.135|proto.3cgroup.cn) ;;
            *) exit 1 ;;
          esac
          mkdir -m 700 -p "$RUNNER_TEMP/ssh"
          ssh-keyscan -T 10 -p "$TARGET_PORT" -t ed25519 "$TARGET_HOST" 2>/dev/null > "$RUNNER_TEMP/ssh/known_hosts"
          fp="$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')"
          test "$fp" = 'SHA256:wRPdG4mucUA07fKN1V/Fes+r38VK0zYWXZ4BYm/6Niw'

          sshpass -e ssh             -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts"             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" 'sh -s' <<'REMOTE'
          set -eu
          cd /srv/benefit-hub
          cid="$(docker compose --project-name benefit-hub -f compose.yaml ps -q benefit-hub)"
          test -n "$cid"

          docker exec -i "$cid" node --input-type=module - <<'NODE'
          import Database from 'better-sqlite3';
          import { drizzle } from 'drizzle-orm/better-sqlite3';
          import * as schema from './dist/db/schema.js';
          import { loadConfig } from './dist/config.js';
          import { activeYangmaoReadConfig } from './dist/modules/suppliers/connection.js';
          import { createYangmaoInriceCatalogClient } from '@sanchuang-dev/provider-yangmao';

          const config=loadConfig(process.env);
          console.log('=== BUSINESS_SOURCES ===');
          for(const c of config.businessOrderClients?.clients ?? []) console.log(c.businessSource);
          console.log('=== END_BUSINESS_SOURCES ===');

          const sqlite=new Database(config.databaseFile,{readonly:true,fileMustExist:true});
          try {
            console.log('=== APPLICATIONS ===');
            for(const row of sqlite.prepare('SELECT business_source,status,id FROM business_applications ORDER BY business_source').all()){
              const count=sqlite.prepare('SELECT COUNT(*) AS c FROM business_application_products WHERE application_id=?').get(row.id).c;
              console.log('source='+row.business_source+' status='+row.status+' products='+count);
            }
            console.log('=== END_APPLICATIONS ===');

            console.log('=== ACTIVE_D_MAPPINGS ===');
            const rows=sqlite.prepare(`
              SELECT p.id AS productId,p.code AS productCodeInternal,mv.product_code AS supplierProductCode
              FROM catalog_products p
              JOIN supplier_product_mappings m ON m.product_id=p.id
              JOIN supplier_product_mapping_versions mv ON mv.id=m.active_version_id
              WHERE mv.provider='yangmao' AND mv.fulfillment_mode='D' AND mv.deduction_unit='amount'
              ORDER BY p.code
            `).all();
            for(const row of rows){
              const apps=sqlite.prepare(`
                SELECT a.business_source AS source
                FROM business_application_products ap
                JOIN business_applications a ON a.id=ap.application_id
                WHERE ap.product_id=? AND a.status='enabled'
                ORDER BY a.business_source
              `).all(row.productId).map(x=>x.source);
              console.log('internal='+row.productCodeInternal+' supplier='+row.supplierProductCode+' enabledApps='+apps.join(','));
            }
            console.log('count='+rows.length);
            console.log('=== END_ACTIVE_D_MAPPINGS ===');

            const db=drizzle(sqlite,{schema});
            const supplier=activeYangmaoReadConfig(db,config);
            if(!supplier) throw new Error('supplier config unavailable');
            const catalog=await createYangmaoInriceCatalogClient(supplier).listProducts();
            const cheapest=[...catalog.products].sort((a,b)=>a.sellPriceCents-b.sellPriceCents)[0];
            console.log('=== CHEAPEST_LIVE_D ===');
            console.log('available='+(cheapest ? 'true':'false'));
            if(cheapest){
              const mapped=rows.some(r=>r.supplierProductCode===cheapest.productCode);
              console.log('hasActivePlatformMapping='+(mapped?'true':'false'));
            }
            console.log('=== END_CHEAPEST_LIVE_D ===');
          } finally { sqlite.close(); }
          NODE
          REMOTE
