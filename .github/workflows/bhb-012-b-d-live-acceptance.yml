name: BHB-012-B Disable D Live Gate After Third Acceptance

on:
  push:
    branches:
      - feat/bhb-012-b-d-live-acceptance-20261031
    paths:
      - .github/workflows/bhb-012-b-d-live-acceptance.yml

permissions:
  contents: read

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install SSH transport
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null

      - name: Disable D live-write gate only
        shell: bash
        env:
          TARGET_HOST: ${{ secrets.PROTO_HOST }}
          TARGET_USER: ${{ secrets.PROTO_USER }}
          TARGET_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/ssh"
          ssh-keyscan -T 10 -p "$TARGET_PORT" -t ed25519 "$TARGET_HOST" 2>/dev/null > "$RUNNER_TEMP/ssh/known_hosts"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')" = 'SHA256:wRPdG4mucUA07fKN1V/Fes+r38VK0zYWXZ4BYm/6Niw'

          sshpass -e ssh             -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts"             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" 'sh -s' <<'REMOTE'
          set -eu
          cd /srv/benefit-hub
          test -f .env
          test ! -L .env
          chmod 600 .env
          if grep -q '^BENEFIT_D_LIVE_WRITE_ENABLED=' .env; then
            sed -i 's/^BENEFIT_D_LIVE_WRITE_ENABLED=.*/BENEFIT_D_LIVE_WRITE_ENABLED=false/' .env
          else
            printf '%s\n' 'BENEFIT_D_LIVE_WRITE_ENABLED=false' >> .env
          fi
          docker compose --project-name benefit-hub -f compose.yaml config -q
          docker compose --project-name benefit-hub -f compose.yaml up -d --no-build >/dev/null
          cid="$(docker compose --project-name benefit-hub -f compose.yaml ps -q benefit-hub)"
          test -n "$cid"
          gate="$(docker exec "$cid" sh -lc 'printf "%s" "$BENEFIT_D_LIVE_WRITE_ENABLED"')"
          test "$gate" = false
          ok=0
          for n in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
          echo 'D_LIVE_WRITE_GATE_ENABLED=false'
          REMOTE
