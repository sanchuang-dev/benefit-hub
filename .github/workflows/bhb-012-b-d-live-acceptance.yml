name: BHB-012-B Prepare Second D Live Acceptance Order

on:
  push:
    branches:
      - feat/bhb-012-b-d-live-acceptance-20261031
    paths:
      - .github/workflows/bhb-012-b-d-live-acceptance.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install SSH transport
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null

      - name: Create second pending D order through real platform API only
        shell: bash
        env:
          TARGET_HOST: ${{ secrets.PROTO_HOST }}
          TARGET_USER: ${{ secrets.PROTO_USER }}
          TARGET_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/ssh"
          ssh-keyscan -T 10 -p "$TARGET_PORT" -t ed25519 "$TARGET_HOST" 2>/dev/null > "$RUNNER_TEMP/ssh/known_hosts"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')" = 'SHA256:wRPdG4mucUA07fKN1V/Fes+r38VK0zYWXZ4BYm/6Niw'

          sshpass -e ssh             -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts"             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" 'sh -s' <<'REMOTE'
          set -eu
          cd /srv/benefit-hub
          cid="$(docker compose --project-name benefit-hub -f compose.yaml ps -q benefit-hub)"
          test -n "$cid"

          docker exec -i "$cid" node --input-type=module - <<'NODE'
          import Database from 'better-sqlite3';
          import { drizzle } from 'drizzle-orm/better-sqlite3';
          import * as schema from './dist/db/schema.js';
          import { loadConfig } from './dist/config.js';
          import { findApplicationBySource } from './dist/modules/applications/applications.js';
          import { issueApplicationCredential, revokeApplicationCredential } from './dist/modules/applications/credentials.js';

          const config=loadConfig(process.env);
          if(!config.dLiveWritesEnabled) throw new Error('D live gate is not enabled');
          const sqlite=new Database(config.databaseFile,{fileMustExist:true});
          const db=drizzle(sqlite,{schema});
          let issued=null;
          try{
            const existing=sqlite.prepare(
              "SELECT id,status,fulfillment_mode AS fulfillmentMode,mapping_version_id AS mappingVersionId FROM benefit_orders WHERE business_source='local-life' AND business_order_no='D-LIVE-ACCEPT-20261031-002'"
            ).get();
            if(existing){
              console.log('=== SECOND_D_ORDER ===');
              console.log('created=false');
              console.log('orderId='+existing.id);
              console.log('status='+existing.status);
              console.log('fulfillmentMode='+existing.fulfillmentMode);
              console.log('mappingVersionIdPresent='+(existing.mappingVersionId?'true':'false'));
              console.log('=== END_SECOND_D_ORDER ===');
              process.exit(0);
            }

            const product=sqlite.prepare(
              "SELECT id FROM catalog_products WHERE code='D-LIVE-ACCEPT-20261031' AND status='active'"
            ).get();
            if(!product) throw new Error('acceptance D product missing');
            const mapping=sqlite.prepare(`
              SELECT mv.fulfillment_mode AS mode,mv.deduction_unit AS unit
              FROM supplier_product_mappings m
              JOIN supplier_product_mapping_versions mv ON mv.id=m.active_version_id
              WHERE m.product_id=?
            `).get(product.id);
            if(!mapping || mapping.mode!=='D' || mapping.unit!=='amount'){
              throw new Error('acceptance D mapping unavailable');
            }

            const actor=sqlite.prepare(
              "SELECT id FROM admin_accounts WHERE disabled_at IS NULL ORDER BY created_at LIMIT 1"
            ).get();
            if(!actor) throw new Error('no active admin actor');
            const app=findApplicationBySource(db,'local-life');
            if(!app || app.status!=='enabled') throw new Error('local-life app unavailable');

            issued=issueApplicationCredential(db,app.id,actor.id);
            const response=await fetch('http://127.0.0.1:3000/api/v1/business/orders',{
              method:'POST',
              headers:{
                Authorization:'Bearer '+issued.secret,
                'Content-Type':'application/json',
              },
              body:JSON.stringify({
                businessOrderNo:'D-LIVE-ACCEPT-20261031-002',
                productId:product.id,
              }),
            });
            const raw=await response.text();
            if(!response.ok) throw new Error('order create failed HTTP '+response.status+' '+raw);
            const body=JSON.parse(raw);
            console.log('=== SECOND_D_ORDER ===');
            console.log('created=true');
            console.log('orderId='+body.order.id);
            console.log('status='+body.order.status);
            console.log('fulfillmentMode='+body.order.fulfillmentMode);
            console.log('mappingVersionIdPresent='+(body.order.mappingVersionId?'true':'false'));
            console.log('=== END_SECOND_D_ORDER ===');
          }finally{
            if(issued){
              const actor=sqlite.prepare(
                "SELECT id FROM admin_accounts WHERE disabled_at IS NULL ORDER BY created_at LIMIT 1"
              ).get();
              const app=findApplicationBySource(db,'local-life');
              if(actor && app) revokeApplicationCredential(db,app.id,issued.credential.id,actor.id);
            }
            sqlite.close();
          }
          NODE
          REMOTE
