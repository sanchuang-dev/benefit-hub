name: BHB-012-B D Dispatch Signature Permutation Probe

on:
  push:
    branches:
      - feat/bhb-012-b-d-live-acceptance-20261031
    paths:
      - .github/workflows/bhb-012-b-d-live-acceptance.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install SSH transport
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null

      - name: Probe D DTO serialization with impossible product and mobile
        shell: bash
        env:
          TARGET_HOST: ${{ secrets.PROTO_HOST }}
          TARGET_USER: ${{ secrets.PROTO_USER }}
          TARGET_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/ssh"
          ssh-keyscan -T 10 -p "$TARGET_PORT" -t ed25519 "$TARGET_HOST" 2>/dev/null > "$RUNNER_TEMP/ssh/known_hosts"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')" = 'SHA256:wRPdG4mucUA07fKN1V/Fes+r38VK0zYWXZ4BYm/6Niw'

          sshpass -e ssh             -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts"             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" 'sh -s' <<'REMOTE'
          set -eu
          cd /srv/benefit-hub
          cid="$(docker compose --project-name benefit-hub -f compose.yaml ps -q benefit-hub)"
          test -n "$cid"

          docker exec -i "$cid" node --input-type=module - <<'NODE'
          import { createHmac } from 'node:crypto';
          import Database from 'better-sqlite3';
          import { drizzle } from 'drizzle-orm/better-sqlite3';
          import * as schema from './dist/db/schema.js';
          import { loadConfig } from './dist/config.js';
          import { activeYangmaoReadConfig } from './dist/modules/suppliers/connection.js';

          const config=loadConfig(process.env);
          const sqlite=new Database(config.databaseFile,{readonly:true,fileMustExist:true});
          const db=drizzle(sqlite,{schema});
          try{
            const supplier=activeYangmaoReadConfig(db,config);
            if(!supplier) throw new Error('supplier config unavailable');

            const values={
              partnerOrderNo:'BHB-D-SIGN-PROBE-20261031',
              productCode:'BHB_NO_SUCH_D_PRODUCT_20261031',
              mobile:'00000000000',
            };
            const orders=[
              ['partnerOrderNo','productCode','mobile'],
              ['partnerOrderNo','mobile','productCode'],
              ['productCode','partnerOrderNo','mobile'],
              ['productCode','mobile','partnerOrderNo'],
              ['mobile','partnerOrderNo','productCode'],
              ['mobile','productCode','partnerOrderNo'],
            ];

            console.log('=== D_SIGNATURE_PERMUTATION_PROBE ===');
            for(let i=0;i<orders.length;i++){
              const keys=orders[i];
              const signed={};
              for(const key of keys) signed[key]=values[key];
              const signedBody=JSON.stringify(signed);
              // HTTP body remains the documented request shape; only HMAC DTO
              // serialization order changes between probes.
              const requestBody=JSON.stringify({
                partnerOrderNo:values.partnerOrderNo,
                productCode:values.productCode,
                mobile:values.mobile,
              });
              const timestamp=String(Date.now());
              const signature=createHmac('sha256',supplier.appSecret)
                .update(timestamp+'\n'+signedBody,'utf8').digest('base64');
              const response=await fetch(supplier.baseUrl+'/api/open/inrice/v1/dispatch',{
                method:'POST',
                headers:{
                  'X-App-Key':supplier.appKey,
                  'X-Timestamp':timestamp,
                  'X-Signature':signature,
                  'Content-Type':'application/json',
                  Accept:'application/json',
                },
                body:requestBody,
                redirect:'manual',
                signal:AbortSignal.timeout(10000),
              });
              const raw=await response.text();
              let vendorCode='unparsed';
              try{ vendorCode=String(JSON.parse(raw)?.code ?? 'missing'); }catch{}
              console.log('case='+(i+1)+' signedOrder='+keys.join(','));
              console.log('httpStatus='+response.status+' vendorCode='+vendorCode);
              console.log('raw='+raw);
              if(vendorCode!=='401'){
                console.log('firstNon401Case='+(i+1));
                break;
              }
            }
            console.log('=== END_D_SIGNATURE_PERMUTATION_PROBE ===');
          }finally{sqlite.close();}
          NODE
          REMOTE
