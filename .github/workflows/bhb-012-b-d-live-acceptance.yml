name: BHB-012-B Prepare One D Live Acceptance Order

on:
  push:
    branches:
      - feat/bhb-012-b-d-live-acceptance-20261031
    paths:
      - .github/workflows/bhb-012-b-d-live-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install SSH transport
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Prepare one pending D platform order without supplier write
        shell: bash
        env:
          TARGET_HOST: ${{ secrets.PROTO_HOST }}
          TARGET_USER: ${{ secrets.PROTO_USER }}
          TARGET_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/ssh"
          ssh-keyscan -T 10 -p "$TARGET_PORT" -t ed25519 "$TARGET_HOST" 2>/dev/null > "$RUNNER_TEMP/ssh/known_hosts"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')" = 'SHA256:wRPdG4mucUA07fKN1V/Fes+r38VK0zYWXZ4BYm/6Niw'
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" 'sh -s' <<'REMOTE'
          set -eu
          cd /srv/benefit-hub
          cid="$(docker compose --project-name benefit-hub -f compose.yaml ps -q benefit-hub)"
          docker exec -i "$cid" node --input-type=module - <<'NODE'
          import Database from 'better-sqlite3';
          import { drizzle } from 'drizzle-orm/better-sqlite3';
          import * as schema from './dist/db/schema.js';
          import { loadConfig } from './dist/config.js';
          import { activeYangmaoReadConfig } from './dist/modules/suppliers/connection.js';
          import { createYangmaoInriceCatalogClient } from '@sanchuang-dev/provider-yangmao';
          import { createProduct } from './dist/modules/catalog/products.js';
          import { createSupplierMappingRepository } from './dist/modules/catalog/supplier-mapping-repository.js';
          import { findApplicationBySource, listApplicationProducts, replaceApplicationProducts } from './dist/modules/applications/applications.js';
          import { issueApplicationCredential, revokeApplicationCredential } from './dist/modules/applications/credentials.js';

          const config=loadConfig(process.env);
          const sqlite=new Database(config.databaseFile,{fileMustExist:true});
          const db=drizzle(sqlite,{schema});
          try{
            const actor=sqlite.prepare("SELECT id FROM admin_accounts WHERE disabled_at IS NULL ORDER BY created_at LIMIT 1").get();
            if(!actor) throw new Error('no active admin actor');

            const supplier=activeYangmaoReadConfig(db,config);
            if(!supplier) throw new Error('supplier unavailable');
            const catalog=await createYangmaoInriceCatalogClient(supplier).listProducts();
            const cheapest=[...catalog.products].sort((a,b)=>a.sellPriceCents-b.sellPriceCents)[0];
            if(!cheapest) throw new Error('no D product');

            let product=sqlite.prepare("SELECT id,code FROM catalog_products WHERE code='D-LIVE-ACCEPT-20261031'").get();
            if(!product){
              product=createProduct(db,{
                code:'D-LIVE-ACCEPT-20261031',
                name:'D live acceptance 2026-10-31',
                shortDescription:'Single controlled supplier acceptance order',
                actorAccountId:actor.id,
              });
            }

            const mappings=createSupplierMappingRepository(db);
            const active=mappings.getActiveVersion(product.id);
            if(!active){
              const draft=mappings.saveDraft({
                productId:product.id,
                expectedVersion:null,
                provider:'yangmao',
                productCode:cheapest.productCode,
                fulfillmentMode:'D',
                deductionUnit:'amount',
              });
              mappings.validateDraft({productId:product.id,expectedVersion:draft.version});
              mappings.activateDraft({productId:product.id,expectedVersion:draft.version,actorAccountId:actor.id});
            }else if(active.productCode!==cheapest.productCode || active.fulfillmentMode!=='D'){
              throw new Error('existing acceptance mapping drift');
            }

            const app=findApplicationBySource(db,'local-life');
            if(!app || app.status!=='enabled') throw new Error('local-life app unavailable');
            const existing=listApplicationProducts(db,app.id).map(x=>x.productId);
            if(!existing.includes(product.id)){
              replaceApplicationProducts(db,app.id,[...existing,product.id],app.version,actor.id);
            }

            const issued=issueApplicationCredential(db,app.id,actor.id);
            try{
              const response=await fetch('http://127.0.0.1:3000/api/v1/business/orders',{
                method:'POST',
                headers:{Authorization:'Bearer '+issued.secret,'Content-Type':'application/json'},
                body:JSON.stringify({businessOrderNo:'D-LIVE-ACCEPT-20261031-001',productId:product.id}),
              });
              const raw=await response.text();
              if(!response.ok) throw new Error('order create HTTP '+response.status+' '+raw);
              const body=JSON.parse(raw);
              console.log('=== PREPARED_ORDER ===');
              console.log('orderId='+body.order.id);
              console.log('status='+body.order.status);
              console.log('fulfillmentMode='+body.order.fulfillmentMode);
              console.log('mappingVersionIdPresent='+(body.order.mappingVersionId?'true':'false'));
              console.log('selectedLowestPriceD=true');
              console.log('=== END_PREPARED_ORDER ===');
            }finally{
              revokeApplicationCredential(db,app.id,issued.credential.id,actor.id);
            }
          }finally{sqlite.close();}
          NODE
          REMOTE
