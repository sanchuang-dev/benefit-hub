name: BHB-011-D Existing Local Evidence Inventory

on:
  workflow_dispatch:
  push:
    branches:
      - feat/bhb-011-d-order-query-investigation-20261031
    paths:
      - .github/workflows/bhb-011-d-protocol-investigation.yml

permissions:
  contents: read

jobs:
  local-evidence-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install SSH transport
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null

      - name: Count local fulfillment evidence without exposing identifiers
        shell: bash
        env:
          TARGET_HOST: ${{ secrets.PROTO_HOST }}
          TARGET_USER: ${{ secrets.PROTO_USER }}
          TARGET_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS" && test -n "$TARGET_USER" && test -n "$TARGET_PORT"
          case "$TARGET_HOST" in
            8.148.148.135|proto.3cgroup.cn) ;;
            *) echo "::error::Unexpected host"; exit 1 ;;
          esac
          case "$TARGET_PORT" in ''|*[!0-9]*) exit 1 ;; esac
          case "$TARGET_USER" in ''|*[!a-zA-Z0-9_.-]*) exit 1 ;; esac
          test "$(getent ahostsv4 proto.3cgroup.cn | awk 'NR==1 {print $1}')" = '8.148.148.135'
          mkdir -m 700 -p "$RUNNER_TEMP/bhb_ssh"
          ssh-keyscan -T 10 -p "$TARGET_PORT" -t ed25519 "$TARGET_HOST" 2>/dev/null > "$RUNNER_TEMP/bhb_ssh/known_hosts"
          test -s "$RUNNER_TEMP/bhb_ssh/known_hosts"
          fp="$(ssh-keygen -lf "$RUNNER_TEMP/bhb_ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')"
          test "$fp" = 'SHA256:wRPdG4mucUA07fKN1V/Fes+r38VK0zYWXZ4BYm/6Niw'

          sshpass -e ssh             -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$RUNNER_TEMP/bhb_ssh/known_hosts"             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -o ConnectTimeout=15             -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" 'sh -s' <<'REMOTE'
          set -eu
          cd /srv/benefit-hub
          cid="$(docker compose --project-name benefit-hub -f compose.yaml ps -q benefit-hub)"
          test -n "$cid"

          docker exec -i "$cid" node --input-type=module - <<'NODE'
          import Database from 'better-sqlite3';
          import { loadConfig } from './dist/config.js';

          const config = loadConfig(process.env);
          const db = new Database(config.databaseFile, {
            readonly: true,
            fileMustExist: true,
          });

          try {
            const byMode = db.prepare(`
              SELECT
                fulfillment_mode AS mode,
                COUNT(*) AS orderCount
              FROM benefit_orders
              GROUP BY fulfillment_mode
              ORDER BY fulfillment_mode
            `).all();

            const attemptsByMode = db.prepare(`
              SELECT
                o.fulfillment_mode AS mode,
                COUNT(a.id) AS attemptCount,
                SUM(CASE
                  WHEN a.upstream_order_no IS NOT NULL
                   AND a.upstream_order_no <> ''
                  THEN 1 ELSE 0 END) AS withUpstreamOrderNo,
                SUM(CASE
                  WHEN a.upstream_request_no IS NOT NULL
                   AND a.upstream_request_no <> ''
                  THEN 1 ELSE 0 END) AS withUpstreamRequestNo
              FROM benefit_orders o
              LEFT JOIN fulfillment_attempts a ON a.order_id = o.id
              GROUP BY o.fulfillment_mode
              ORDER BY o.fulfillment_mode
            `).all();

            console.log('=== ORDER_COUNTS_BY_MODE ===');
            for (const row of byMode) {
              console.log('mode=' + row.mode + ' orders=' + row.orderCount);
            }
            console.log('=== END_ORDER_COUNTS_BY_MODE ===');

            console.log('=== ATTEMPT_COUNTS_BY_MODE ===');
            for (const row of attemptsByMode) {
              console.log(
                'mode=' + row.mode +
                ' attempts=' + row.attemptCount +
                ' upstream_order_refs=' + (row.withUpstreamOrderNo ?? 0) +
                ' upstream_request_refs=' + (row.withUpstreamRequestNo ?? 0)
              );
            }
            console.log('=== END_ATTEMPT_COUNTS_BY_MODE ===');
          } finally {
            db.close();
          }
          NODE
          REMOTE
