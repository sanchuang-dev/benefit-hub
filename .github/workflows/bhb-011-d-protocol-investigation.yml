name: BHB-011-D Read-only Order Query DTO Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/bhb-011-d-order-query-investigation-20261031
    paths:
      - .github/workflows/bhb-011-d-protocol-investigation.yml

permissions:
  contents: read

jobs:
  order-query-dto-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install SSH transport
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null

      - name: Probe null-serialized DTO shapes for D order query
        shell: bash
        env:
          TARGET_HOST: ${{ secrets.PROTO_HOST }}
          TARGET_USER: ${{ secrets.PROTO_USER }}
          TARGET_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS" && test -n "$TARGET_USER" && test -n "$TARGET_PORT"
          case "$TARGET_HOST" in
            8.148.148.135|proto.3cgroup.cn) ;;
            *) echo "::error::Unexpected host"; exit 1 ;;
          esac
          case "$TARGET_PORT" in ''|*[!0-9]*) exit 1 ;; esac
          case "$TARGET_USER" in ''|*[!a-zA-Z0-9_.-]*) exit 1 ;; esac
          test "$(getent ahostsv4 proto.3cgroup.cn | awk 'NR==1 {print $1}')" = '8.148.148.135'
          mkdir -m 700 -p "$RUNNER_TEMP/bhb_ssh"
          ssh-keyscan -T 10 -p "$TARGET_PORT" -t ed25519 "$TARGET_HOST" 2>/dev/null > "$RUNNER_TEMP/bhb_ssh/known_hosts"
          test -s "$RUNNER_TEMP/bhb_ssh/known_hosts"
          fp="$(ssh-keygen -lf "$RUNNER_TEMP/bhb_ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')"
          test "$fp" = 'SHA256:wRPdG4mucUA07fKN1V/Fes+r38VK0zYWXZ4BYm/6Niw'

          sshpass -e ssh             -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$RUNNER_TEMP/bhb_ssh/known_hosts"             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -o ConnectTimeout=15             -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" 'sh -s' <<'REMOTE'
          set -eu
          cd /srv/benefit-hub
          cid="$(docker compose --project-name benefit-hub -f compose.yaml ps -q benefit-hub)"
          test -n "$cid"

          docker exec -i "$cid" node --input-type=module - <<'NODE'
          import Database from 'better-sqlite3';
          import { drizzle } from 'drizzle-orm/better-sqlite3';
          import * as schema from './dist/db/schema.js';
          import { loadConfig } from './dist/config.js';
          import { activeYangmaoReadConfig } from './dist/modules/suppliers/connection.js';
          import { createInriceSignature, createYangmaoInriceCatalogClient } from '@sanchuang-dev/provider-yangmao';

          const config = loadConfig(process.env);
          const sqlite = new Database(config.databaseFile, { readonly: true, fileMustExist: true });
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          function permutations(items) {
            if (items.length <= 1) return [items];
            const result = [];
            for (let i = 0; i < items.length; i += 1) {
              const head = items[i];
              const rest = items.slice(0, i).concat(items.slice(i + 1));
              for (const tail of permutations(rest)) result.push([head, ...tail]);
            }
            return result;
          }

          function combinations(items, size, start = 0, prefix = [], out = []) {
            if (prefix.length === size) {
              out.push([...prefix]);
              return out;
            }
            for (let i = start; i < items.length; i += 1) {
              prefix.push(items[i]);
              combinations(items, size, i + 1, prefix, out);
              prefix.pop();
            }
            return out;
          }

          async function probe(supplier, caseNo, keys) {
            const signedObject = {};
            for (const key of keys) signedObject[key] = null;
            const signedBody = JSON.stringify(signedObject);
            const timestamp = String(Date.now());
            const signature = createInriceSignature(supplier.appSecret, timestamp, signedBody);

            const response = await fetch(
              new URL('/api/open/inrice/v1/orders/query', supplier.baseUrl),
              {
                method: 'GET',
                headers: {
                  'X-App-Key': supplier.appKey,
                  'X-Timestamp': timestamp,
                  'X-Signature': signature,
                  Accept: 'application/json',
                },
                redirect: 'manual',
                signal: AbortSignal.timeout(10_000),
              },
            );
            const rawBody = await response.text();
            let vendorCode = null;
            try {
              const parsed = JSON.parse(rawBody);
              if (Number.isInteger(parsed?.code)) vendorCode = parsed.code;
            } catch {}

            console.log('=== CASE ' + String(caseNo).padStart(3, '0') + ' ===');
            console.log('dto_keys_in_order=' + keys.join(','));
            console.log('signed_json=' + signedBody);
            console.log('http_status=' + response.status);
            console.log('vendor_code=' + (vendorCode ?? 'unparsed'));
            console.log('response_body_raw_begin');
            console.log(rawBody);
            console.log('response_body_raw_end');
            console.log('=== END_CASE ===');
            return vendorCode;
          }

          try {
            const db = drizzle(sqlite, { schema });
            const supplier = activeYangmaoReadConfig(db, config);
            if (!supplier) throw new Error('Supplier read configuration unavailable');

            const catalog = await createYangmaoInriceCatalogClient(supplier).listProducts();
            console.log('positive_control_products=' + catalog.products.length);

            const fields = [
              'partnerOrderNo',
              'orderNo',
              'thirdPartyNo',
              'inriceRecordNo',
              'recordNo',
              'mobile',
            ];

            let caseNo = 0;
            let hit = false;

            outer:
            for (const size of [1, 2, 3]) {
              for (const combo of combinations(fields, size)) {
                for (const keys of permutations(combo)) {
                  caseNo += 1;
                  const code = await probe(supplier, caseNo, keys);
                  if (code !== 401) {
                    console.log('=== NON_401_HIT ===');
                    console.log('hit_case=' + caseNo);
                    console.log('hit_keys_in_order=' + keys.join(','));
                    console.log('hit_vendor_code=' + code);
                    console.log('=== END_NON_401_HIT ===');
                    hit = true;
                    break outer;
                  }
                  await sleep(70);
                }
              }
            }

            console.log('=== DTO_PROBE_SUMMARY ===');
            console.log('cases=' + caseNo);
            console.log('non_401_hit=' + hit);
            console.log('=== END_DTO_PROBE_SUMMARY ===');
          } finally {
            sqlite.close();
          }
          NODE
          REMOTE
